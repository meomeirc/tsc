name: Verify Windows publish

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Create temporary tools-folder publish fixtures
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "tools" -Force | Out-Null
          Set-Content -LiteralPath "tools/publish-tool-check.txt" -Value "tools-folder-publish-check" -NoNewline
          Set-Content -LiteralPath "tools/ffmpeg.exe" -Value "must-not-be-published" -NoNewline

      - name: Publish Windows x64 game with integrated updater
        run: dotnet publish TSC.csproj --configuration Publish --property:PublishProfile=TSC-Publish

      - name: Verify launcher and game publish layout
        shell: pwsh
        run: |
          $publishRoot = Join-Path $env:GITHUB_WORKSPACE "bin/Publish/win-x64"
          $dataDir = Join-Path $publishRoot "data"
          $requiredFiles = @(
            (Join-Path $publishRoot "TSC.exe"),
            (Join-Path $publishRoot "Skins/Default/skin.lua"),
            (Join-Path $dataDir "TSC.exe"),
            (Join-Path $dataDir "TSC.dll"),
            (Join-Path $dataDir "TSC.deps.json"),
            (Join-Path $dataDir "TSC.runtimeconfig.json"),
            (Join-Path $dataDir "coreclr.dll")
          )

          foreach ($path in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected publish file is missing: $path"
            }
          }

          $launcherSize = (Get-Item -LiteralPath (Join-Path $publishRoot "TSC.exe")).Length
          if ($launcherSize -gt 5MB) {
            throw "Launcher is too large ($launcherSize bytes); expected a small Native AOT executable."
          }

          foreach ($oldSidecar in @("TSC.dll", "TSC.deps.json", "TSC.runtimeconfig.json", "coreclr.dll")) {
            if (Test-Path -LiteralPath (Join-Path $publishRoot $oldSidecar)) {
              throw "Duplicate game runtime file remains beside the launcher: $oldSidecar"
            }
          }
          $rootDlls = @(Get-ChildItem -LiteralPath $publishRoot -File -Filter "*.dll" -ErrorAction SilentlyContinue)
          if ($rootDlls.Count -gt 0) {
            throw "Game DLLs remain beside the launcher: $($rootDlls.Name -join ', ')"
          }
          if (Test-Path -LiteralPath (Join-Path $publishRoot "runtimes")) {
            throw "The game runtime was not fully moved under data/."
          }

          if (Test-Path -LiteralPath (Join-Path $dataDir "Skins/Default")) {
            throw "Default skin is duplicated under data/ instead of staying beside the launcher."
          }

          if (Test-Path -LiteralPath (Join-Path $publishRoot "updater")) {
            throw "Publish output still contains the obsolete standalone updater folder."
          }

          $toolsFixture = Join-Path $publishRoot "tools/publish-tool-check.txt"
          if (-not (Test-Path -LiteralPath $toolsFixture -PathType Leaf)) {
            throw "Project tools/ files were not copied beside the launcher."
          }
          if (Test-Path -LiteralPath (Join-Path $publishRoot "tools/ffmpeg.exe")) {
            throw "The user-installed FFmpeg executable must not be included in publish output."
          }
          if (Test-Path -LiteralPath (Join-Path $dataDir "tools")) {
            throw "Tool files should live beside the launcher, not under data/."
          }

          Write-Host "Verified tiny Native AOT launcher ($launcherSize bytes), game runtime under data/, user skin root, and tools/ payload without ffmpeg.exe."
