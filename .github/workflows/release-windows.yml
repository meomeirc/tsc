name: Release Windows build

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: windows-release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release:
    name: Build and publish release assets
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ github.token }}

    steps:
      - name: Check out tagged source
        uses: actions/checkout@v4

      - name: Validate release tag and version
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          if ($tag -notmatch '^v(?<version>\d+(?:\.\d+){1,3})$') {
            throw "Release tags must look like v0.0.17. Got '$tag'."
          }

          $tagVersion = $Matches['version']
          $fileVersion = (Get-Content -LiteralPath 'version.txt' -Raw).Trim()
          if ($fileVersion -ne $tagVersion) {
            throw "Tag '$tag' does not match version.txt ('$fileVersion'). Update version.txt yourself, commit it, and push the matching version tag."
          }

          Write-Host "Preparing release $tag from version.txt $fileVersion."

      - name: Set up .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Create temporary tools-folder publish fixtures
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path 'tools' -Force | Out-Null
          Set-Content -LiteralPath 'tools/publish-tool-check.txt' -Value 'tools-folder-publish-check' -NoNewline
          Set-Content -LiteralPath 'tools/ffmpeg.exe' -Value 'must-not-be-published' -NoNewline

      - name: Publish Windows x64 game and native launcher
        shell: pwsh
        run: dotnet publish TSC.csproj --configuration Publish --property:PublishProfile=TSC-Publish

      - name: Verify publish layout and remove test fixtures
        shell: pwsh
        run: |
          $publishRoot = Join-Path $env:GITHUB_WORKSPACE 'bin/Publish/win-x64'
          $dataDir = Join-Path $publishRoot 'data'
          $requiredFiles = @(
            (Join-Path $publishRoot 'TSC.exe'),
            (Join-Path $publishRoot 'Skins/Default/skin.lua'),
            (Join-Path $dataDir 'TSC.exe'),
            (Join-Path $dataDir 'TSC.dll'),
            (Join-Path $dataDir 'TSC.deps.json'),
            (Join-Path $dataDir 'TSC.runtimeconfig.json'),
            (Join-Path $dataDir 'coreclr.dll')
          )

          foreach ($path in $requiredFiles) {
            if (-not (Test-Path -LiteralPath $path -PathType Leaf)) {
              throw "Expected publish file is missing: $path"
            }
          }

          $launcherSize = (Get-Item -LiteralPath (Join-Path $publishRoot 'TSC.exe')).Length
          if ($launcherSize -gt 5MB) {
            throw "Launcher is too large ($launcherSize bytes); expected a small Native AOT executable."
          }

          foreach ($oldSidecar in @('TSC.dll', 'TSC.deps.json', 'TSC.runtimeconfig.json', 'coreclr.dll')) {
            if (Test-Path -LiteralPath (Join-Path $publishRoot $oldSidecar)) {
              throw "Duplicate game runtime file remains beside the launcher: $oldSidecar"
            }
          }

          $rootDlls = @(Get-ChildItem -LiteralPath $publishRoot -File -Filter '*.dll' -ErrorAction SilentlyContinue)
          if ($rootDlls.Count -gt 0) {
            throw "Game DLLs remain beside the launcher: $($rootDlls.Name -join ', ')"
          }
          if (Test-Path -LiteralPath (Join-Path $publishRoot 'runtimes')) {
            throw 'The game runtime was not fully moved under data/.'
          }
          if (Test-Path -LiteralPath (Join-Path $dataDir 'Skins/Default')) {
            throw 'Default skin is duplicated under data/ instead of staying beside the launcher.'
          }
          if (Test-Path -LiteralPath (Join-Path $publishRoot 'updater')) {
            throw 'Publish output still contains the obsolete standalone updater folder.'
          }

          $toolsFixture = Join-Path $publishRoot 'tools/publish-tool-check.txt'
          if (-not (Test-Path -LiteralPath $toolsFixture -PathType Leaf)) {
            throw 'Project tools/ files were not copied beside the launcher.'
          }
          if (Test-Path -LiteralPath (Join-Path $publishRoot 'tools/ffmpeg.exe')) {
            throw 'The user-installed FFmpeg executable must not be included in publish output.'
          }
          if (Test-Path -LiteralPath (Join-Path $dataDir 'tools')) {
            throw 'Tool files should live beside the launcher, not under data/.'
          }

          # Remove the fixtures from both the checked-out source tree and publish output
          # before release packaging, so test files can never end up in a public ZIP.
          foreach ($fixture in @(
            (Join-Path $env:GITHUB_WORKSPACE 'tools/publish-tool-check.txt'),
            (Join-Path $env:GITHUB_WORKSPACE 'tools/ffmpeg.exe'),
            (Join-Path $publishRoot 'tools/publish-tool-check.txt'),
            (Join-Path $publishRoot 'tools/ffmpeg.exe')
          )) {
            if (Test-Path -LiteralPath $fixture -PathType Leaf) {
              Remove-Item -LiteralPath $fixture -Force
            }
          }

          Write-Host "Verified publish layout with launcher size $launcherSize bytes. Removed temporary test fixtures."

      - name: Build full, minimal, patch, and manifest assets
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content -LiteralPath 'version.txt' -Raw).Trim()
          $publishRoot = Join-Path $env:GITHUB_WORKSPACE 'bin/Publish/win-x64'
          $outputDir = Join-Path $env:GITHUB_WORKSPACE 'release-assets'

          if (Test-Path -LiteralPath $outputDir) {
            Remove-Item -LiteralPath $outputDir -Recurse -Force
          }
          New-Item -ItemType Directory -Path $outputDir -Force | Out-Null

          $apiPath = "repos/$env:GITHUB_REPOSITORY/releases?per_page=100"
          $releaseJson = gh api $apiPath
          if ($LASTEXITCODE -ne 0) {
            throw 'Could not query existing GitHub releases to prepare the update patch.'
          }
          $releaseJsonText = $releaseJson -join [Environment]::NewLine
          $releases = @(ConvertFrom-Json -InputObject $releaseJsonText)
          $targetVersion = [version]$version

          $currentReleaseExists = @($releases | Where-Object {
            -not $_.draft -and -not $_.prerelease -and $_.tag_name -eq $tag
          }).Count -gt 0

          if (-not $currentReleaseExists) {
            $newerReleasedVersions = @(
              foreach ($release in $releases) {
                if ($release.draft -or $release.prerelease) { continue }
                if ([string]$release.tag_name -notmatch '^v?(?<version>\d+(?:\.\d+){1,3})$') { continue }
                $candidateVersion = [version]$Matches['version']
                if ($candidateVersion -gt $targetVersion) { $candidateVersion }
              }
            )
            if ($newerReleasedVersions.Count -gt 0) {
              $highestNewer = $newerReleasedVersions | Sort-Object -Descending | Select-Object -First 1
              throw "Cannot publish $tag because a newer release ($highestNewer) already exists. Increase version.txt and create a new tag."
            }
          }

          $previousCandidates = @(
            foreach ($release in $releases) {
              if ($release.draft -or $release.prerelease) { continue }
              if ([string]$release.tag_name -notmatch '^v?(?<version>\d+(?:\.\d+){1,3})$') { continue }
              $candidateVersionText = $Matches['version']
              $candidateVersion = [version]$candidateVersionText
              if ($candidateVersion -ge $targetVersion) { continue }

              $fullName = "TSC-win-x64-$candidateVersionText.zip"
              $manifestName = "TSC-win-x64-$candidateVersionText-manifest.json"
              $assetNames = @($release.assets | ForEach-Object { [string]$_.name })
              if (($assetNames -contains $fullName) -and ($assetNames -contains $manifestName)) {
                [pscustomobject]@{
                  Tag = [string]$release.tag_name
                  VersionText = $candidateVersionText
                  Version = $candidateVersion
                  FullZipName = $fullName
                  ManifestName = $manifestName
                }
              }
            }
          )
          $previous = $previousCandidates | Sort-Object -Property Version -Descending | Select-Object -First 1

          $packager = Join-Path $env:GITHUB_WORKSPACE 'Updater/BuildReleaseAssets.ps1'
          if ($null -ne $previous) {
            $downloadDir = Join-Path $env:RUNNER_TEMP 'tsc-previous-release'
            if (Test-Path -LiteralPath $downloadDir) {
              Remove-Item -LiteralPath $downloadDir -Recurse -Force
            }
            New-Item -ItemType Directory -Path $downloadDir -Force | Out-Null

            gh release download $previous.Tag --pattern $previous.FullZipName --pattern $previous.ManifestName --dir $downloadDir --repo $env:GITHUB_REPOSITORY
            if ($LASTEXITCODE -ne 0) {
              throw "Could not download the previous full release assets for $($previous.Tag)."
            }

            $previousZip = Join-Path $downloadDir $previous.FullZipName
            $previousManifest = Join-Path $downloadDir $previous.ManifestName
            if (-not (Test-Path -LiteralPath $previousZip -PathType Leaf) -or -not (Test-Path -LiteralPath $previousManifest -PathType Leaf)) {
              throw "The previous release $($previous.Tag) did not download its full ZIP and combined manifest."
            }

            & $packager -Version $version -PublishDirectory $publishRoot -OutputDirectory $outputDir -PreviousFullZip $previousZip -PreviousManifestPath $previousManifest
          }
          else {
            Write-Host 'No earlier release with a full ZIP and combined manifest was found. This will be packaged as the first full/minimal release, without a patch ZIP.'
            & $packager -Version $version -PublishDirectory $publishRoot -OutputDirectory $outputDir
          }

          $requiredAssets = @(
            "TSC-win-x64-$version.zip",
            "TSC-win-x64-$version-minimal.zip",
            "TSC-win-x64-$version-manifest.json"
          )
          foreach ($name in $requiredAssets) {
            if (-not (Test-Path -LiteralPath (Join-Path $outputDir $name) -PathType Leaf)) {
              throw "Release packaging did not produce required asset '$name'."
            }
          }
          Write-Host 'Release assets:'
          Get-ChildItem -LiteralPath $outputDir -File | Sort-Object Name | ForEach-Object { Write-Host " - $($_.Name) ($($_.Length) bytes)" }

      - name: Create GitHub Release and upload assets
        shell: pwsh
        run: |
          $tag = $env:GITHUB_REF_NAME
          $version = (Get-Content -LiteralPath 'version.txt' -Raw).Trim()
          $outputDir = Join-Path $env:GITHUB_WORKSPACE 'release-assets'
          $assetPaths = @(Get-ChildItem -LiteralPath $outputDir -File | Sort-Object Name | ForEach-Object { $_.FullName })
          if ($assetPaths.Count -lt 3) {
            throw "Expected full ZIP, minimal ZIP, and combined manifest in '$outputDir'."
          }

          gh release view $tag --repo $env:GITHUB_REPOSITORY --json tagName *> $null
          $releaseExists = $LASTEXITCODE -eq 0
          if ($releaseExists) {
            Write-Host "Release $tag already exists; replacing its generated assets."
            gh release upload $tag @assetPaths --clobber --repo $env:GITHUB_REPOSITORY
          }
          else {
            Write-Host "Creating release $tag."
            gh release create $tag @assetPaths --title "TSC $version" --generate-notes --verify-tag --repo $env:GITHUB_REPOSITORY
          }
          if ($LASTEXITCODE -ne 0) {
            throw "GitHub release publishing failed for $tag."
          }
